<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Made Solid Studio: a workspace for website modernisation." />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/studio.webmanifest" />
    <title>Made Solid Studio</title>
  </head>
  <body>
    <div id="root">
      <main
        id="studio-startup-shell"
        style="
          box-sizing: border-box;
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #0d0d0d;
          color: #f4f1e8;
          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
        "
      >
        <section style="max-width: 32rem; text-align: center">
          <h1 style="margin: 0; font-size: 1.25rem; line-height: 1.3">Opening Made Solid Studio</h1>
          <p
            id="studio-startup-message"
            role="status"
            aria-live="polite"
            style="margin: 10px 0 0; color: #b9b5aa; line-height: 1.55"
          >
            Loading the development workspace…
          </p>
          <a
            id="studio-startup-reload"
            href=""
            hidden
            style="
              min-height: 44px;
              margin-top: 20px;
              padding: 0 18px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              border: 1px solid #68645b;
              border-radius: 8px;
              color: #f4f1e8;
              text-decoration: none;
            "
          >
            Reload development Studio
          </a>
        </section>
      </main>
    </div>
    <script>
      (() => {
        const recoveryKey = 'made-solid-studio-startup-recovery';
        const message = document.getElementById('studio-startup-message');
        const reload = document.getElementById('studio-startup-reload');
        let mounted = false;
        let startupFailed = false;

        const markFailed = () => {
          if (mounted || startupFailed) return;
          startupFailed = true;
          let alreadyRetried = false;
          try {
            alreadyRetried = sessionStorage.getItem(recoveryKey) === 'retrying';
          } catch {
            // Storage can be unavailable in privacy-focused browsers; the visible fallback still works.
          }
          if (!alreadyRetried) {
            if (message)
              message.textContent = 'The development server changed while loading. Reconnecting…';
            try {
              sessionStorage.setItem(recoveryKey, 'retrying');
            } catch {
              // Continue with the one automatic recovery attempt.
            }
            window.setTimeout(() => window.location.reload(), 900);
            return;
          }
          if (message) {
            message.textContent =
              'The development Studio could not start. Your source and saved work are safe. Reload to try again.';
          }
          if (reload) reload.hidden = false;
        };

        window.addEventListener(
          'made-solid:studio-mounted',
          () => {
            mounted = true;
            try {
              sessionStorage.removeItem(recoveryKey);
            } catch {
              // No recovery state needs clearing when storage is unavailable.
            }
          },
          { once: true },
        );
        window.addEventListener(
          'error',
          (event) => {
            if (event.target instanceof HTMLScriptElement) markFailed();
          },
          true,
        );
        window.addEventListener('unhandledrejection', markFailed);
        window.setTimeout(markFailed, 10_000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
